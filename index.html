<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょちゅうみまい を つくろう</title>

<style>
body{
    font-family:"Yu Gothic",sans-serif;
    background:#e6f7ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0077cc;
    font-size:2em;
}

.section{
    margin-top:20px;
    background:#f5fbff;
    padding:15px;
    border-radius:15px;
}

h2{
    color:#0055aa;
}

label{
    display:block;
    margin:10px 0;
    font-size:1.3em;
}

button{
    display:block;
    margin:25px auto;
    font-size:1.5em;
    padding:12px 30px;
    background:#ff9900;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    padding:20px;
    border:3px solid #0077cc;
    border-radius:15px;
    background:#fffef0;
    font-size:1.4em;
    line-height:2;
}
</style>
</head>

<body>

<div class="container">

<h1>🎐 しょちゅうみまい を つくろう 🎐</h1>

<div class="section">
<h2>① だれに かく？</h2>


<label><input type="radio" name="who" value="たんにんのせんせいへ">
たんにんのせんせい</label>

<label><input type="radio" name="who" value="〇〇せんせいへ">
〇〇せんせい</label>


</div>

<div class="section">
<h2>② あいさつを えらぼう</h2>

<label><input type="radio" name="greet" value="しょちゅうおみまいもうしあげます。">
しょちゅうおみまいもうしあげます。</label>

<label><input type="radio" name="greet" value="おげんきですか。">
おげんきですか。</label>

<label><input type="radio" name="greet" value="そのご、おげんきですか。">
そのご、おげんきですか。</label>

</div>

<div class="section">
<h2>③ つたえたいことを えらぼう</h2>

<label><input type="radio" name="text" value="いつもありがとうございます。">
いつもありがとうございます。</label>

<label><input type="radio" name="text" value="がっこうではおせわになっています。">
がっこうではおせわになっています。</label>

<label><input type="radio" name="text" value="またおはなしできるのをたのしみにしています。">
またおはなしできるのをたのしみにしています。</label>

<label><input type="radio" name="text" value="これからもよろしくおねがいします。">
これからもよろしくおねがいします。</label>

</div>

<div class="section">
<h2>④ さいごのことばを えらぼう</h2>

<label><input type="radio" name="end" value="おからだにきをつけてください。">
おからだにきをつけてください。</label>

<label><input type="radio" name="end" value="おげんきでおすごしください。">
おげんきでおすごしください。</label>

<label><input type="radio" name="end" value="これからもよろしくおねがいします。">
これからもよろしくおねがいします。</label>

</div>

<button onclick="makeCard()">かんせい</button>

<div id="result"></div>

</div>

<script>
function getValue(name){
  const item = document.querySelector('input[name="'+name+'"]:checked');
  return item ? item.value : '';
}

function makeCard(){

  const who = getValue('who');
  const greet = getValue('greet');
  const text = getValue('text');
  const end = getValue('end');

  document.getElementById('result').innerHTML =
    '<strong>' + who + '</strong><br><br>' +
    greet + '<br><br>' +
    text + '<br><br>' +
    end + '<br><br>' +
    '〇〇 より';
}
</script>

</body>
</html>
