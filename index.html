<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょちゅうみまい を つくろう</title>

<style>
body{
    font-family:"Yu Gothic",sans-serif;
    background:#e6f7ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0077cc;
}

.section{
    margin-top:20px;
    background:#f5fbff;
    padding:15px;
    border-radius:15px;
}

label{
    display:block;
    margin:12px 0;
    font-size:1.3em;
}

input[type="text"]{
    width:95%;
    font-size:1.5em;
    padding:10px;
    border:3px solid #0077cc;
    border-radius:10px;
}

input[type="radio"]{
    transform:scale(1.5);
    margin-right:10px;
}

button{
    display:block;
    margin:25px auto;
    font-size:1.4em;
    padding:12px 30px;
    background:#ff9900;
    color:white;
    border:none;
    border-radius:10px;
}

#result{
    width:420px;
    height:650px;
    margin:30px auto;

    border:3px solid #333;
    background:#fffef0;

    padding:30px;
    box-sizing:border-box;

    writing-mode:vertical-rl;
    -webkit-writing-mode:vertical-rl;
    text-orientation:upright;

    font-size:1.5em;
    line-height:2;

    position:relative;
    overflow:hidden;
}

.from{
    position:absolute;
    left:20px;
    bottom:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎐 しょちゅうみまい を つくろう 🎐</h1>

<div class="section">
<h2>① せんせい の なまえ</h2>

<input
type="text"
id="teacherName"
placeholder="せんせい の なまえ">
</div>

<div class="section">
<h2>② つたえたいこと を えらぼう</h2>

<label>
<input type="radio" name="text" value="いつもありがとうございます。">
いつもありがとうございます。
</label>

<label>
<input type="radio" name="text" value="がっこうではおせわになっています。">
がっこうではおせわになっています。
</label>

<label>
<input type="radio" name="text" value="またおはなしできるのをたのしみにしています。">
またおはなしできるのをたのしみにしています。
</label>

<label>
<input type="radio" name="text" value="これからもよろしくおねがいします。">
これからもよろしくおねがいします。
</label>

</div>

<div class="section">
<h2>③ さいご の ことば を えらぼう</h2>

<label>
<input type="radio" name="end" value="おからだにきをつけてください。">
おからだにきをつけてください。
</label>

<label>
<input type="radio" name="end" value="おげんきでおすごしください。">
おげんきでおすごしください。
</label>

<label>
<input type="radio" name="end" value="これからもよろしくおねがいします。">
これからもよろしくおねがいします。
</label>

</div>

<button onclick="makeCard()">かんせい</button>

<div id="result">
<div>〇〇先生へ</div>
<div>暑中お見舞い申し上げます。</div>
<div>いつもありがとうございます。</div>
<div>おからだにきをつけてください。</div>
<div class="from">〇〇より</div>
</div>

</div>

<script>
function getValue(name){
    const item = document.querySelector(
        'input[name="' + name + '"]:checked'
    );
    return item ? item.value : '';
}

function makeCard(){

    const teacherName =
        document.getElementById('teacherName').value || '〇〇先生';

    const text =
        getValue('text') || 'いつもありがとうございます。';

    const end =
        getValue('end') || 'おからだにきをつけてください。';

    document.getElementById('result').innerHTML = `
        <div>${teacherName}へ</div>
        <div>暑中お見舞い申し上げます。</div>
        <div>${text}</div>
        <div>${end}</div>
        <div class="from">〇〇より</div>
    `;
}
</script>

</body>
</html>
